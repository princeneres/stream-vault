[package]
name = "stream-vault"
version = "0.4.0"
description = "Local media library desktop app"
authors = ["Stream Vault Contributors"]
edition = "2021"

[lib]
name = "stream_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util", "net", "process"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
walkdir = "2"
regex = "1"
once_cell = "1"
tiny_http = "0.12"
urlencoding = "2"

[dev-dependencies]
tempfile = "3"
